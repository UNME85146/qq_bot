[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qq-realistic-role-bot"
version = "0.1.0"
description = "QQ realistic virtual character bot prototype using NoneBot2 and OneBot v11."
requires-python = ">=3.12,<3.14"
dependencies = [
  "nonebot2[fastapi]==2.5.0",
  "nonebot-adapter-onebot==2.4.6",
  "httpx>=0.27,<1.0",
  "aiosqlite>=0.20,<1.0",
  "feedparser>=6.0.14,<7.0",
  "python-dotenv>=1.0,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0"
]
market = [
  "akshare>=1.18.81,<2.0",
  "yfinance>=1.5.2,<2.0"
]
video = [
  "yt-dlp>=2026.7.4,<2027.0",
  "socksio>=1.0,<2.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
asyncio_mode = "auto"
testpaths = ["tests"]
