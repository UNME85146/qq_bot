[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid
loglevel=info

[program:pmhq]
command=/usr/local/bin/start-qqbot-stack.sh pmhq
priority=10
autostart=true
autorestart=true
startsecs=8
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:llbot]
command=/usr/local/bin/start-qqbot-stack.sh llbot
priority=20
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bot]
command=/usr/local/bin/start-qqbot-stack.sh bot
priority=30
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
